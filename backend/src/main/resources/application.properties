server.port=8080

# ─── Supabase PostgreSQL ───────────────────────────────────────────────────
# Remplacez les valeurs ci-dessous par vos credentials Supabase
# Project Settings > Database > Connection string (JDBC)
spring.datasource.url=jdbc:postgresql://db.VOTRE_REF_SUPABASE.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=VOTRE_MOT_DE_PASSE_SUPABASE
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Logs ──────────────────────────────────────────────────────────────────
logging.level.com.dgcockpit=INFO

<div class="relative w-full">
  <!-- Input -->
  <div class="relative">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">🔍</span>
    <input
      type="text"
      [ngModel]="query()"
      (input)="onInput($event)"
      placeholder="Rechercher..."
      class="w-full pl-9 pr-4 py-2 bg-gray-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all outline-none"
    />
    <div *ngIf="loading()" class="absolute right-3 top-1/2 -translate-y-1/2">
      <div class="w-3 h-3 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- Dropdown de résultats -->
  <div *ngIf="showResults() && (results().length > 0 || (query().length >= 2 && !loading()))"
       class="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-xl border border-gray-100 z-50 overflow-hidden max-h-80 overflow-y-auto">
    
    <div *ngIf="results().length > 0" class="py-2">
      <a *ngFor="let res of results()"
         [routerLink]="res.type === 'instruction' ? ['/chat'] : res.type === 'courrier' ? ['/inbox'] : ['/appointments']"
         (click)="selectResult()"
         class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50 transition-colors group">
        <span class="text-lg">{{ res.icon }}</span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate group-hover:text-primary">{{ res.titre }}</p>
          <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">{{ res.type }}</p>
        </div>
      </a>
    </div>

    <div *ngIf="results().length === 0 && query().length >= 2 && !loading()" class="p-8 text-center">
      <p class="text-sm text-gray-400">Aucun résultat pour "{{ query() }}"</p>
    </div>
  </div>
</div>

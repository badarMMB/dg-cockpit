# Stack DEV : uniquement les services externes (postgres + minio).
# L'app Angular tourne sur l'hote via `npm start` (port 4200, proxy vers 8080).
# L'app Spring Boot tourne sur l'hote via `mvn spring-boot:run` (port 8080, DevTools).
# => Modifications de code = reload instantane, sans rebuild Docker.

services:

  postgres:
    image: postgres:15-alpine
    container_name: dg-cockpit-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"          # 5433 sur l'hote (5432 deja pris par Postgres local)
    environment:
      POSTGRES_DB: dgcockpit
      POSTGRES_USER: ged_user
      POSTGRES_PASSWORD: ged_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: dg-cockpit-minio
    restart: unless-stopped
    ports:
      - "9000:9000"          # API S3
      - "9001:9001"          # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    name: dg-cockpit_postgres_data    # reutilise le volume existant
  minio_data:
    name: dg-cockpit_minio_data

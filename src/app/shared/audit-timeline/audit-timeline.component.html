<div>
  <div *ngIf="loading()" class="flex justify-center py-4">
    <div class="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading() && logs().length === 0" class="text-center py-4 text-xs text-gray-400">
    Aucune activité enregistrée
  </div>

  <ol *ngIf="!loading() && logs().length > 0" class="relative border-l border-gray-200 space-y-4 ml-2">
    <li *ngFor="let log of logs()" class="pl-5">
      <!-- dot -->
      <span class="absolute -left-2 w-4 h-4 bg-white border-2 border-primary rounded-full flex items-center justify-center text-[8px]">
        {{ icon(log['action']) }}
      </span>
      <p class="text-xs font-semibold text-gray-800">{{ log['action'] }}</p>
      <p *ngIf="log['details']" class="text-[11px] text-gray-500 mt-0.5 leading-snug">{{ log['details'] }}</p>
      <time class="text-[10px] text-gray-400 mt-0.5 block">{{ formatDate(log['createdAt']) }}</time>
    </li>
  </ol>
</div>

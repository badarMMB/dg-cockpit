<!-- ─── Barre supérieure mobile ─────────────────────────────────────── -->
<div class="lg:hidden fixed top-0 left-0 right-0 z-40 bg-white border-b border-gray-200 flex items-center justify-between px-4 h-14 shadow-sm">
  <div class="flex items-center gap-2">
    <div class="w-7 h-7 rounded-md bg-primary flex items-center justify-center text-white font-bold text-sm">DG</div>
    <span class="font-bold text-primary tracking-tight">Cockpit</span>
  </div>
  <button (click)="toggleMobileMenu()" class="p-2 rounded-md text-gray-600 hover:bg-gray-100 transition-colors">
    <svg *ngIf="!isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
    <svg *ngIf="isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>

<!-- ─── Overlay fond mobile ─────────────────────────────────────────── -->
<div *ngIf="isMobileMenuOpen()" (click)="toggleMobileMenu()"
     class="lg:hidden fixed inset-0 z-40 bg-black/40 backdrop-blur-sm">
</div>

<!-- ─── Sidebar desktop (fixe) + mobile (drawer) ───────────────────── -->
<aside class="h-screen bg-background border-r border-gray-200 flex flex-col py-6 transition-transform duration-300 ease-in-out"
       [ngClass]="{
         'w-[280px] translate-x-0': true,
         'fixed top-0 left-0 z-50 shadow-2xl': true,
         'lg:relative lg:translate-x-0': true,
         '-translate-x-full': !isMobileMenuOpen(),
         'translate-x-0': isMobileMenuOpen()
       }">

  <!-- Logo -->
  <div class="px-6 mb-8 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white font-bold text-xl">DG</div>
    <span class="font-bold text-lg text-primary tracking-tight">Cockpit</span>
  </div>

  <!-- Recherche globale -->
  <div class="px-4 mb-3">
    <app-search-bar></app-search-bar>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
    <a *ngFor="let item of menuItems()"
       [routerLink]="item.route"
       (click)="setActive(item.route)"
       class="flex items-center justify-between px-3 py-3 rounded-sm transition-colors cursor-pointer group relative"
       [ngClass]="activeRoute().startsWith(item.route)
         ? 'bg-primary/5 text-primary font-medium'
         : 'text-gray-600 hover:bg-primary/5 hover:text-primary'">

      <div *ngIf="activeRoute().startsWith(item.route)"
           class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3/4 bg-primary rounded-r-full">
      </div>

      <div class="flex items-center gap-3">
        <span class="text-xl" [ngClass]="activeRoute().startsWith(item.route) ? 'text-primary' : 'text-gray-400 group-hover:text-primary'">
          {{ item.icon }}
        </span>
        <span class="text-sm">{{ item.label }}</span>
      </div>

      <div *ngIf="item.unread > 0"
           class="px-2 py-0.5 rounded-full text-xs font-semibold"
           [ngClass]="item.alert ? 'bg-alert text-white' : 'bg-gray-200 text-gray-700'">
        {{ item.unread }}
      </div>
    </a>
  </nav>

  <!-- Notifications + profil -->
  <div class="mt-auto px-4 pt-4 border-t border-gray-200">

    <!-- Panneau notifications (slide-up) -->
    <div *ngIf="showNotifPanel()" class="mb-3 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden max-h-64 flex flex-col">
      <div class="px-3 py-2 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
        <span class="text-xs font-bold text-gray-600 uppercase tracking-wider">Notifications</span>
        <button (click)="clearNotifs()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
      </div>
      <div class="overflow-y-auto flex-1">
        <div *ngFor="let n of notifications()" class="px-3 py-2 border-b border-gray-50 last:border-0">
          <p class="text-xs font-medium text-gray-800 truncate">{{ n.type }}</p>
          <p class="text-[10px] text-gray-500">{{ n['instructionId'] || n['fileName'] || '' }}</p>
        </div>
        <div *ngIf="notifications().length === 0" class="px-3 py-4 text-center text-xs text-gray-400">
          Aucune notification
        </div>
      </div>
    </div>

    <!-- Barre profil + cloche + déconnexion -->
    <div class="flex items-center gap-2 pb-2">
      <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary text-sm flex-shrink-0">
        {{ userInitials() }}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-gray-900 truncate">{{ currentUser()?.nomComplet }}</div>
        <div class="text-xs text-gray-500">{{ roleLabel() }}</div>
      </div>
      <!-- Cloche notifications -->
      <button (click)="toggleNotifPanel()" class="relative p-1.5 rounded-lg transition-colors flex-shrink-0"
              [ngClass]="showNotifPanel() ? 'text-primary bg-primary/10' : 'text-gray-400 hover:text-primary hover:bg-primary/5'">
        <span class="text-base">🔔</span>
        <span *ngIf="unreadCount() > 0"
              class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-alert text-white rounded-full text-[9px] font-bold flex items-center justify-center">
          {{ unreadCount() > 9 ? '9+' : unreadCount() }}
        </span>
      </button>
      <!-- Déconnexion -->
      <button (click)="logout()" title="Se déconnecter"
              class="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
        </svg>
      </button>
    </div>

  </div>
</aside>

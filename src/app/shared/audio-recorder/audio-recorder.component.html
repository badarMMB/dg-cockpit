<div class="flex items-center gap-2">

  <!-- Erreur micro -->
  <span *ngIf="error()" class="text-xs text-red-500">{{ error() }}</span>

  <!-- Idle : bouton micro -->
  <button *ngIf="!isRecording() && !error()"
          (click)="startRecording()"
          title="Enregistrer un message vocal"
          class="p-2 rounded-lg text-gray-400 hover:text-primary hover:bg-primary/5 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/>
    </svg>
  </button>

  <!-- Enregistrement en cours -->
  <ng-container *ngIf="isRecording()">
    <!-- Indicateur pulse + timer -->
    <div class="flex items-center gap-1.5 px-3 py-1.5 bg-red-50 border border-red-200 rounded-full">
      <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
      <span class="text-xs font-mono text-red-600 font-semibold">{{ formatTime(seconds()) }}</span>
    </div>
    <!-- Waveform CSS (5 barres animées) -->
    <div class="flex items-center gap-0.5 h-5">
      <div *ngFor="let h of [3,5,4,6,3,5,4]"
           class="w-0.5 bg-red-400 rounded-full animate-bounce"
           [style.height.px]="h * 2"
           [style.animation-delay.ms]="h * 50"></div>
    </div>
    <!-- Stop -->
    <button (click)="stopRecording()" title="Arrêter et envoyer"
            class="p-1.5 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="1"/>
      </svg>
    </button>
    <!-- Annuler -->
    <button (click)="cancelRecording()" title="Annuler"
            class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
  </ng-container>

</div>

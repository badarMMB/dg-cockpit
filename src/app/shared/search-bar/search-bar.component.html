<div class="relative">
  <!-- Champ de saisie -->
  <div class="flex items-center bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 gap-2 focus-within:border-primary focus-within:bg-white focus-within:ring-1 focus-within:ring-primary transition-all">
    <div *ngIf="isLoading()" class="w-3.5 h-3.5 border-2 border-primary/30 border-t-primary rounded-full animate-spin flex-shrink-0"></div>
    <span *ngIf="!isLoading()" class="text-gray-400 text-xs flex-shrink-0">🔍</span>
    <input
      type="text"
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (keydown.escape)="close()"
      placeholder="Rechercher..."
      autocomplete="off"
      class="flex-1 bg-transparent text-sm focus:outline-none text-gray-800 placeholder-gray-400 min-w-0">
    <button *ngIf="query()" (click)="close()"
            class="text-gray-400 hover:text-gray-600 flex-shrink-0 text-lg leading-none">&times;</button>
  </div>

  <!-- Dropdown résultats -->
  <div *ngIf="isOpen()"
       class="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-2xl z-50 overflow-hidden max-h-72 overflow-y-auto">

    <div *ngFor="let result of results()"
         (click)="navigate(result)"
         class="flex items-center gap-3 px-3 py-2.5 hover:bg-primary/5 cursor-pointer border-b border-gray-50 last:border-0 transition-colors">
      <span class="text-base flex-shrink-0">{{ icon(result['type']) }}</span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-medium text-gray-900 truncate">{{ result['titre'] }}</p>
        <p class="text-xs text-gray-500 truncate">
          {{ label(result['type']) }}<span *ngIf="result['apercu']"> • {{ result['apercu'] }}</span>
        </p>
      </div>
      <span class="text-gray-300 text-xs flex-shrink-0">›</span>
    </div>

    <div *ngIf="results().length === 0 && !isLoading()"
         class="px-3 py-4 text-center text-xs text-gray-400">
      Aucun résultat pour "{{ query() }}"
    </div>
  </div>
</div>

server.port=8080

# ─── PostgreSQL ────────────────────────────────────────────────────────────
# En Docker : les variables SPRING_DATASOURCE_* injectées par docker-compose prennent le dessus
# En local  : modifiez les valeurs par défaut ci-dessous
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dgcockpit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ged_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ged_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── MinIO ────────────────────────────────────────────────────────────────
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:dgcockpit}

# ─── Collabora Online / WOPI ──────────────────────────────────────────────
# public-url  : URL chargée par le navigateur (iframe Collabora)
# internal-url : URL interne (conversion .docx → .pdf server-to-server)
# wopi.host   : URL que Collabora utilise pour rappeler nos endpoints /api/wopi
collabora.public-url=${COLLABORA_PUBLIC_URL:http://localhost:9980}
collabora.internal-url=${COLLABORA_INTERNAL_URL:http://localhost:9980}
collabora.wopi.host=${WOPI_HOST_INTERNAL:http://host.docker.internal:8080}
collabora.wopi.token-ttl=${WOPI_TOKEN_TTL_SECONDS:3600}

# ─── JPA / Hibernate ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Upload limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Logs ──────────────────────────────────────────────────────────────────
logging.level.com.dgcockpit=INFO

# ─── Assistant IA (Claude API) ────────────────────────────────────────────
# Mettre la clé dans .env (non versionné) : AI_LLM_API_KEY=sk-ant-...
# ai.llm.enabled=false par défaut si pas de clé configurée
ai.llm.api-key=${AI_LLM_API_KEY:}
ai.llm.endpoint=${AI_LLM_ENDPOINT:https://api.anthropic.com/v1/messages}
ai.llm.model=${AI_LLM_MODEL:claude-haiku-4-5-20251001}
ai.llm.enabled=${AI_LLM_ENABLED:true}
# Mode auto-apply : true = modifie directement le .docx ; false = poste une suggestion dans le fil
ai.llm.auto-apply=${AI_LLM_AUTO_APPLY:false}

# ─── DevTools (dev uniquement) ─────────────────────────────────────────────
# Auto-restart sur changement de classe Java, exclu en prod par Spring Boot
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
